<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.23.12/dist/css/uikit.min.css" />
    <title>{{ reviewer.name }}</title>
</head>
<body>
    {% block content %}
    <div class="uk-container uk-margin-top">
        <!-- Информация о рецензенте -->
        <div class="uk-heading-small">
            {{ reviewer.name }} • Возраст: {{ reviewer.age }} • Город: {{ reviewer.city }}
        </div>

        <div class="uk-heading-small">Отзывы</div>

        <!-- Список отзывов -->
        {% if reviews %}
            {% for review in reviews %}
                <div class="uk-margin">
                    <strong>{{ review.movie.title }}</strong> - Оценка: {{ review.rating }}/10 - {{ review.text }}
                </div>
            {% endfor %}
        {% else %}
            <p>Нет отзывов</p>
        {% endif %}
    </div>
    {% endblock %}
</body>
</html>
